<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bad qualityifier</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍟</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<header>
  <h1>bad qualityifier</h1>
  <nav>
    <button id="open" type="button">open</button>
    <button id="cam" type="button">camera</button>
    <button id="crop" type="button" disabled>crop</button>
    <button id="rot" type="button" disabled>rotate</button>
    <button id="fliph" type="button" disabled>flip</button>
    <button id="flipv" type="button" disabled>flip v</button>
    <button id="peek" type="button" disabled>original</button>
    <button id="copy" type="button" disabled>copy</button>
    <button id="save" type="button" class="primary" disabled>save</button>
  </nav>
</header>

<main>
  <section id="stage">
    <div class="frame">
      <canvas id="out"></canvas>
      <canvas id="orig"></canvas>
      <canvas id="cropc" hidden></canvas>
      <button id="drop" type="button"><b>+</b><span>drop / paste / open</span></button>
    </div>
    <div id="filters"></div>
    <div id="cropbar">
      <button type="button" data-ar="0" class="on">free</button>
      <button type="button" data-ar="1">1:1</button>
      <button type="button" data-ar="0.8">4:5</button>
      <button type="button" data-ar="0.5625">9:16</button>
      <button type="button" data-ar="1.777778">16:9</button>
      <span class="gap"></span>
      <button type="button" id="cropreset">whole</button>
      <button type="button" id="cropcancel">cancel</button>
      <button type="button" id="cropdone" class="primary">done</button>
    </div>
    <p id="toast" hidden></p>
  </section>

  <aside>
    <div id="tools">
      <button id="random" type="button" class="alt">random</button>
      <button id="reset" type="button" class="alt">reset</button>
      <button id="savelook" type="button">save look</button>
      <button id="copylink" type="button">copy link</button>
    </div>
    <form id="lookform" hidden>
      <input id="lookname" type="text" maxlength="24" placeholder="name" autocomplete="off">
      <button type="submit" class="primary">ok</button>
      <button type="button" id="lookcancel">cancel</button>
    </form>
    <div id="sections"></div>
  </aside>
</main>

<div id="camui" hidden>
  <video id="video" autoplay playsinline muted></video>
  <div>
    <button id="snap" type="button" class="primary">snap</button>
    <button id="camflip" type="button">flip</button>
    <button id="camclose" type="button">close</button>
  </div>
</div>

<input id="file" type="file" accept="image/*" hidden>
<script src="effects.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
