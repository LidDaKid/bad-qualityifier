<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bad qualityifier</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍟</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>bad qualityifier</h1>
  <nav>
    <button id="open" type="button">open</button>
    <button id="peek" type="button" disabled>original</button>
    <button id="copy" type="button" disabled>copy</button>
    <button id="save" type="button" class="primary" disabled>save</button>
  </nav>
</header>

<main>
  <section id="stage">
    <div class="frame">
      <canvas id="out"></canvas>
      <canvas id="orig"></canvas>
    </div>
    <button id="drop" type="button"><b>+</b><span>drop / paste / open</span></button>
    <p id="toast" hidden></p>
  </section>

  <aside>
    <div id="presets"></div>
    <div id="sliders"></div>
  </aside>
</main>

<input id="file" type="file" accept="image/*" hidden>
<script src="fryer.js"></script>
</body>
</html>
